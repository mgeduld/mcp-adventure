<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>MCP Adventure</title>

    <style>
      body {
        max-width: 700px;
        margin: 60px auto;
        padding: 0 24px;
        font-family: system-ui, sans-serif;
        line-height: 1.5;
      }

      button {
        padding: 10px 16px;
        font: inherit;
        cursor: pointer;
      }

      button:disabled {
        cursor: wait;
      }

      #result {
        margin-top: 24px;
        padding: 16px;
        min-height: 60px;
        white-space: pre-wrap;
        background: #f3f3f3;
        border-radius: 6px;
      }
    </style>
  </head>

  <body>
    <h1>MCP Adventure</h1>

    <p>
      Ask the local language model about the seeded demo game.
    </p>

    <button id="ask-button" type="button">
      Ask about The Forgotten Keep
    </button>

    <div id="result">No response yet.</div>

    <script>
      const button = document.querySelector("#ask-button");
      const result = document.querySelector("#result");

      button.addEventListener("click", async () => {
        button.disabled = true;
        result.textContent = "Asking Ollama...";

        try {
          const response = await fetch("/api/demo", {
            method: "POST",
          });

          const body = await response.json();

          if (!response.ok) {
            throw new Error(body.error ?? "Request failed");
          }

          result.textContent = body.answer;
        } catch (error) {
          result.textContent =
            error instanceof Error
              ? `Error: ${error.message}`
              : "An unexpected error occurred";
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
