<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>MCP Adventure</title>

  <style>
    body {
      max-width: 700px;
      margin: 60px auto;
      padding: 0 24px;
      font-family: system-ui, sans-serif;
      line-height: 1.5;
    }

    button {
      padding: 10px 16px;
      font: inherit;
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
    }

    #result {
      margin-top: 24px;
      padding: 16px;
      min-height: 60px;
      white-space: pre-wrap;
      background: #f3f3f3;
      border-radius: 6px;
    }

    #command-form {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 24px;
    }

    #command-form label {
      width: 100%;
    }

    #command-input {
      flex: 1;
      min-width: 180px;
      padding: 10px;
      font: inherit;
    }

    #conversation p {
      padding: 12px;
      background: #f3f3f3;
      border-radius: 6px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <h1>MCP Adventure</h1>

  <p>
    Ask the local language model about the seeded demo game.
  </p>

  <button id="ask-button" type="button">
    Ask about The Forgotten Keep
  </button>

  <button id="start-button" type="button">
    Start The Forgotten Keep
  </button>

  <button id="look-button" type="button" disabled>
    Look around
  </button>

  <p id="game-status">No active playthrough.</p>

  <form id="command-form">
    <label for="command-input">What would you like to do?</label>
    <input id="command-input" type="text" maxlength="2000" placeholder="Take the blue key" required disabled />
    <button id="send-button" type="submit" disabled>Send</button>
  </form>

  <div id="conversation" role="log" aria-label="Game conversation"></div>

  <div id="result">No response yet.</div>

  <script>
    const button = document.querySelector("#ask-button");
    const result = document.querySelector("#result");
    const startButton = document.querySelector("#start-button");
    const gameStatus = document.querySelector("#game-status");
    const storageKey = "mcp-adventure.playthrough";
    const lookButton = document.querySelector("#look-button");
    const commandForm = document.querySelector("#command-form");
    const commandInput = document.querySelector("#command-input");
    const sendButton = document.querySelector("#send-button");
    const conversation = document.querySelector("#conversation");

    let commandPending = false;

    let activeGame = null;

    function showActiveGame() {
      gameStatus.textContent = activeGame
        ? "A playthrough is saved in this browser."
        : "No active playthrough.";

      startButton.disabled = activeGame !== null;
      lookButton.disabled = activeGame === null || commandPending;
      commandInput.disabled = activeGame === null || commandPending;
      sendButton.disabled = activeGame === null || commandPending;
    }

    function appendMessage(speaker, text) {
      const paragraph = document.createElement("p");
      paragraph.textContent = `${speaker}: ${text}`;
      conversation.appendChild(paragraph);
    }

    commandForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const message = commandInput.value.trim();

      if (!activeGame || commandPending || !message) {
        return;
      }

      commandPending = true;
      appendMessage("You", message);
      commandInput.value = "";
      result.textContent = "Thinking...";
      showActiveGame();

      try {
        const response = await fetch(
          `/api/game/${encodeURIComponent(activeGame.playthroughId)}/chat`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ message }),
          },
        );

        const body = await response.json();

        if (!response.ok) {
          throw new Error(body.error ?? "Could not process your command");
        }

        appendMessage("Game", body.answer);
        result.textContent = "";
      } catch (error) {
        appendMessage(
          "Error",
          error instanceof Error
            ? error.message
            : "An unexpected error occurred",
        );

        result.textContent = "";
      } finally {
        commandPending = false;
        showActiveGame();
        commandInput.focus();
      }
    });

    try {
      const saved = localStorage.getItem(storageKey);

      if (saved) {
        const parsed = JSON.parse(saved);

        if (
          parsed !== null &&
          typeof parsed === "object" &&
          !Array.isArray(parsed) &&
          typeof parsed.playthroughId === "string" &&
          parsed.playthroughId.length > 0 &&
          typeof parsed.currentRoomId === "string" &&
          parsed.currentRoomId.length > 0 &&
          typeof parsed.resumeToken === "string" &&
          parsed.resumeToken.length > 0
        ) {
          activeGame = parsed;
        } else {
          localStorage.removeItem(storageKey);
        }
      }
    } catch {
      gameStatus.textContent = "Could not read the saved playthrough.";
    }

    showActiveGame();

    startButton.addEventListener("click", async () => {
      startButton.disabled = true;
      result.textContent = "Starting The Forgotten Keep...";

      try {
        const response = await fetch("/api/game/start", {
          method: "POST",
        });

        const body = await response.json();

        if (!response.ok) {
          throw new Error(body.error ?? "Could not start the game");
        }

        activeGame = body;

        try {
          localStorage.setItem(storageKey, JSON.stringify(activeGame));
          result.textContent = "Game started. Your playthrough is saved.";
        } catch {
          result.textContent =
            "Game started, but this browser could not save it for refresh.";
        }
      } catch (error) {
        result.textContent =
          error instanceof Error
            ? `Error: ${error.message}`
            : "An unexpected error occurred";
      } finally {
        showActiveGame();
      }
    });

    button.addEventListener("click", async () => {
      button.disabled = true;
      result.textContent = "Asking Ollama...";

      try {
        const response = await fetch("/api/demo", {
          method: "POST",
        });

        const body = await response.json();

        if (!response.ok) {
          throw new Error(body.error ?? "Request failed");
        }

        result.textContent = body.answer;
      } catch (error) {
        result.textContent =
          error instanceof Error
            ? `Error: ${error.message}`
            : "An unexpected error occurred";
      } finally {
        button.disabled = false;
      }
    });

    lookButton.addEventListener("click", async () => {
      if (!activeGame) {
        return;
      }

      lookButton.disabled = true;
      result.textContent = "Looking around...";

      try {
        const response = await fetch(
          `/api/game/${encodeURIComponent(activeGame.playthroughId)}/look`,
          { method: "POST" },
        );

        const body = await response.json();

        if (!response.ok) {
          throw new Error(body.error ?? "Could not look around");
        }

        result.textContent = body.answer;
      } catch (error) {
        result.textContent =
          error instanceof Error
            ? `Error: ${error.message}`
            : "An unexpected error occurred";
      } finally {
        showActiveGame();
      }
    });


    function appendMessage(speaker, text) {
      const paragraph = document.createElement("p");
      paragraph.textContent = `${speaker}: ${text}`;
      conversation.appendChild(paragraph);
    }

    commandForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const message = commandInput.value.trim();

      if (!activeGame || commandPending || !message) {
        return;
      }

      commandPending = true;
      appendMessage("You", message);
      commandInput.value = "";
      result.textContent = "Thinking...";
      showActiveGame();

      try {
        const response = await fetch(
          `/api/game/${encodeURIComponent(activeGame.playthroughId)}/chat`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ message }),
          },
        );

        const body = await response.json();

        if (!response.ok) {
          throw new Error(body.error ?? "Could not process your command");
        }

        appendMessage("Game", body.answer);
        result.textContent = "";
      } catch (error) {
        appendMessage(
          "Error",
          error instanceof Error
            ? error.message
            : "An unexpected error occurred",
        );

        result.textContent = "";
      } finally {
        commandPending = false;
        showActiveGame();
        commandInput.focus();
      }
    });
  </script>
</body>

</html>
