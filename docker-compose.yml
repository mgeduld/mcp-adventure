services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mcp_adventure}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mcp_adventure}
      POSTGRES_DB: ${POSTGRES_DB:-mcp_adventure}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-mcp_adventure} -d ${POSTGRES_DB:-mcp_adventure}
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:

